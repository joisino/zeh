[project]
name = "zeh"
version = "0.1.0"
description = "Zero-Error Horizon: A Safety-Critical Metric for LLM Capability Boundaries"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "transformers>=4.36",
    "triton>=2.1",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "tqdm>=4.65",
    "accelerate>=0.25",
    "setuptools>=61.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "setuptools>=61.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
extraPaths = ["src"]
pythonVersion = "3.10"
